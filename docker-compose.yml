# ---------------------------------------------------------------------------
# Rezo — local development infrastructure (Step 1 scaffold)
# Brings up the three backing services the beta needs: PostgreSQL, Redis, MinIO.
# The application services (api / web) run on the host during development.
#
#   docker compose up -d
#
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: rezo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rezo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rezo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rezo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rezo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rezo} -d ${POSTGRES_DB:-rezo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rezo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rezo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rezo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rezo_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rezo_minio_secret}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rezo_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the documents bucket on first boot so the API has somewhere
  # to store files in later steps. Exits 0 once the bucket exists.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-rezo_minio_access} ${S3_SECRET_KEY:-rezo_minio_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-rezo-documents} &&
      echo 'MinIO bucket ready';
      "

volumes:
  rezo_postgres_data:
  rezo_redis_data:
  rezo_minio_data:
